<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나만의 카페</title>
<style>
body{font-family:Arial,sans-serif;background:#f7f3ed;color:#3d3028;margin:0;padding:25px}
main{max-width:820px;margin:auto;background:white;padding:25px;border-radius:16px}
h1{text-align:center} .intro{text-align:center;color:#78695e}
h2{margin-top:28px;border-bottom:1px solid #eadfd5;padding-bottom:8px}
.menus{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.item{border:1px solid #eadfd5;border-radius:12px;padding:14px;text-align:center;background:#fffdfa}
.emoji{font-size:32px}button{background:#79543b;color:white;border:0;border-radius:8px;padding:9px 13px;cursor:pointer}
button:hover{background:#5f402d}.secondary{background:#9b8b7e}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee7e1}
.summary{line-height:1.9;margin-top:16px}.final{font-size:21px;font-weight:bold;color:#79543b}
#message{color:#3c7548;font-weight:bold;min-height:22px}
</style>
</head>
<body>
<main>
<h1>☕ 나만의 카페</h1>
<p class="intro">원하는 음료를 선택해 주문해 보세요!</p>
<h2>음료 메뉴</h2><div class="menus" id="menus"></div>
<h2>장바구니</h2><div id="cart">아직 담긴 음료가 없습니다.</div>
<div class="summary">
<div>총금액: <span id="total">0</span>원</div>
<div>할인 금액: <span id="discount">0</span>원</div>
<div class="final">결제 금액: <span id="final">0</span>원</div>
</div>
<p><button onclick="checkout()">주문 완료</button>
<button class="secondary" onclick="resetCart()">장바구니 비우기</button></p>
<p id="message" aria-live="polite"></p>
</main>
<script>
const menu=[
{name:"아메리카노",price:3000,emoji:"☕"},
{name:"카페라떼",price:4000,emoji:"🥛"},
{name:"바닐라라떼",price:4500,emoji:"🧋"},
{name:"초코라떼",price:4500,emoji:"🍫"}
];
let cart=[];

function showMenu(){
 const area=document.getElementById("menus");
 area.innerHTML="";
 menu.forEach((drink,i)=>{
  area.innerHTML+=`<div class="item"><div class="emoji">${drink.emoji}</div>
  <h3>${drink.name}</h3><p>${drink.price.toLocaleString()}원</p>
  <button onclick="addToCart(${i})">장바구니 담기</button></div>`;
 });
}
function addToCart(i){
 cart.push(menu[i]);
 document.getElementById("message").textContent=menu[i].name+"를 담았습니다.";
 updateCart();
}
function removeItem(i){cart.splice(i,1);updateCart();}
function updateCart(){
 const area=document.getElementById("cart");
 if(cart.length===0){area.textContent="아직 담긴 음료가 없습니다.";}
 else{
  area.innerHTML=cart.map((d,i)=>`<div class="row"><span>${d.name} - ${d.price.toLocaleString()}원</span>
  <button class="secondary" onclick="removeItem(${i})">삭제</button></div>`).join("");
 }
 const total=cart.reduce((sum,d)=>sum+d.price,0);
 const discount=total>=10000?Math.floor(total*0.1):0;
 document.getElementById("total").textContent=total.toLocaleString();
 document.getElementById("discount").textContent=discount.toLocaleString();
 document.getElementById("final").textContent=(total-discount).toLocaleString();
}
function checkout(){
 if(cart.length===0){document.getElementById("message").textContent="먼저 음료를 선택해 주세요.";return;}
 const total=cart.reduce((sum,d)=>sum+d.price,0);
 const discount=total>=10000?Math.floor(total*0.1):0;
 document.getElementById("message").textContent=
 "주문 완료! 최종 결제 금액은 "+(total-discount).toLocaleString()+"원입니다.";
}
function resetCart(){
 cart=[];updateCart();
 document.getElementById("message").textContent="장바구니를 비웠습니다.";
}
showMenu();updateCart();
</script>
</body>
</html>
